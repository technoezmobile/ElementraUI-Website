<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="#09090B"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#27272A" stroke-opacity="0.8"/>
  <defs>
    <linearGradient id="el-grad-1" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="el-grad-2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
